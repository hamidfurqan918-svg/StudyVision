<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Vision - Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#080b12;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:#111620;
    border:1px solid #242b38;
    border-radius:20px;
    padding:30px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#8d96a8;
    margin-bottom:30px;
}

h2{
    margin-bottom:20px;
}

label{
    display:block;
    color:#bfc8d8;
    font-size:14px;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:16px;
    border-radius:10px;
    border:1px solid #2b3445;
    background:#171d29;
    color:white;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#667085;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:white;
    color:#080b12;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.forgot{
    text-align:right;
    margin-top:-5px;
    margin-bottom:18px;
    color:#aeb7c8;
    font-size:13px;
    cursor:pointer;
}

.forgot:hover{
    color:white;
}

.switch{
    text-align:center;
    margin-top:20px;
    color:#8d96a8;
    font-size:14px;
}

.switch span{
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.message{
    text-align:center;
    margin-top:15px;
    font-size:14px;
    min-height:20px;
}
</style>
</head>

<body>

<div class="login-box">

<div class="logo">🧠 Study Vision</div>

<div class="subtitle">
Class 12th — JKBOSE
</div>


<!-- LOGIN -->

<div id="loginSection">

<h2>Login</h2>

<label>Email</label>

<input
type="email"
id="loginEmail"
placeholder="Enter your email"
>

<label>Password</label>

<input
type="password"
id="loginPassword"
placeholder="Enter your password"
>

<div class="forgot" onclick="showForgot()">
Forgot password?
</div>

<button onclick="loginUser()">
Login
</button>

<div class="switch">
Don't have an account?
<span onclick="showSignup()">Sign Up</span>
</div>

</div>


<!-- SIGN UP -->

<div id="signupSection" style="display:none;">

<h2>Create Account</h2>

<label>Email</label>

<input
type="email"
id="signupEmail"
placeholder="Enter your email"
>

<label>Password</label>

<input
type="password"
id="signupPassword"
placeholder="Create a password"
>

<button onclick="signupUser()">
Create Account
</button>

<div class="switch">
Already have an account?
<span onclick="showLogin()">Login</span>
</div>

</div>


<!-- FORGOT PASSWORD -->

<div id="forgotSection" style="display:none;">

<h2>Forgot Password</h2>

<label>Email</label>

<input
type="email"
id="forgotEmail"
placeholder="Enter your registered email"
>

<button onclick="sendResetLink()">
Send Reset Link
</button>

<div class="switch">
Remember your password?
<span onclick="showLogin()">Login</span>
</div>

</div>


<!-- NEW PASSWORD -->

<div id="resetSection" style="display:none;">

<h2>Set New Password</h2>

<label>New Password</label>

<input
type="password"
id="newPassword"
placeholder="Enter new password"
>

<label>Confirm Password</label>

<input
type="password"
id="confirmPassword"
placeholder="Confirm new password"
>

<button onclick="updatePassword()">
Update Password
</button>

</div>


<div class="message" id="message"></div>

</div>


<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://qnjfvoskjnyzrvrebdna.supabase.co";


const SUPABASE_KEY =
"sb_publishable_O1zIFLt53T-puwRyg9a4MA_czXQn8G9";


const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);


// SHOW LOGIN

window.showLogin = function(){

document.getElementById("loginSection").style.display="block";
document.getElementById("signupSection").style.display="none";
document.getElementById("forgotSection").style.display="none";
document.getElementById("resetSection").style.display="none";

document.getElementById("message").innerText="";

};


// SHOW SIGNUP

window.showSignup = function(){

document.getElementById("loginSection").style.display="none";
document.getElementById("signupSection").style.display="block";
document.getElementById("forgotSection").style.display="none";
document.getElementById("resetSection").style.display="none";

document.getElementById("message").innerText="";

};


// SHOW FORGOT

window.showForgot = function(){

document.getElementById("loginSection").style.display="none";
document.getElementById("signupSection").style.display="none";
document.getElementById("forgotSection").style.display="block";
document.getElementById("resetSection").style.display="none";

document.getElementById("message").innerText="";

};


// SIGN UP

window.signupUser = async function(){

const email =
document.getElementById("signupEmail").value.trim();

const password =
document.getElementById("signupPassword").value;

const message =
document.getElementById("message");


if(!email || !password){

message.innerText =
"Please enter email and password.";

return;

}


if(password.length < 6){

message.innerText =
"Password must be at least 6 characters.";

return;

}


message.innerText =
"Creating account...";


const {data,error} =
await supabase.auth.signUp({

email:email,
password:password

});


if(error){

message.innerText =
error.message;

return;

}


if(data.session){

window.location.href =
"index.html";

}else{

message.innerText =
"Account created! Check your email.";

}

};


// LOGIN

window.loginUser = async function(){

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value;

const message =
document.getElementById("message");


if(!email || !password){

message.innerText =
"Please enter email and password.";

return;

}


message.innerText =
"Logging in...";


const {data,error} =
await supabase.auth.signInWithPassword({

email:email,
password:password

});


if(error){

message.innerText =
error.message;

return;

}


window.location.href =
"index.html";

};


// SEND RESET LINK

window.sendResetLink = async function(){

const email =
document.getElementById("forgotEmail").value.trim();

const message =
document.getElementById("message");


if(!email){

message.innerText =
"Please enter your email.";

return;

}


message.innerText =
"Sending reset link...";


const {error} =
await supabase.auth.resetPasswordForEmail(
email,
{
redirectTo:
"https://hamidfurqan918-svg.github.io/StudyVision/login.html"
}
);


if(error){

message.innerText =
error.message;

return;

}


message.innerText =
"Reset link sent! Check your email.";

};


// PASSWORD RECOVERY

supabase.auth.onAuthStateChange(
async function(event){

if(event === "PASSWORD_RECOVERY"){

document.getElementById("loginSection").style.display="none";
document.getElementById("signupSection").style.display="none";
document.getElementById("forgotSection").style.display="none";
document.getElementById("resetSection").style.display="block";

document.getElementById("message").innerText =
"Enter your new password.";

}

}
);


// UPDATE PASSWORD

window.updatePassword = async function(){

const password =
document.getElementById("newPassword").value;

const confirm =
document.getElementById("confirmPassword").value;

const message =
document.getElementById("message");


if(!password || !confirm){

message.innerText =
"Please fill both password fields.";

return;

}


if(password.length < 6){

message.innerText =
"Password must be at least 6 characters.";

return;

}


if(password !== confirm){

message.innerText =
"Passwords do not match.";

return;

}


message.innerText =
"Updating password...";


const {error} =
await supabase.auth.updateUser({

password:password

});


if(error){

message.innerText =
error.message;

return;

}


message.innerText =
"Password updated successfully!";


setTimeout(function(){

window.location.href =
"index.html";

},1500);

};


// CHECK SESSION

const {data} =
await supabase.auth.getSession();


if(data.session){

window.location.href =
"index.html";

}

</script>

</body>
</html>
