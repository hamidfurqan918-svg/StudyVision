<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Vision - Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#080b12;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:420px;
    background:#111620;
    border:1px solid #252d3a;
    border-radius:22px;
    padding:30px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#8d96a8;
    margin-bottom:30px;
}

h2{
    margin-bottom:20px;
}

label{
    display:block;
    color:#bfc8d8;
    font-size:14px;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border-radius:10px;
    border:1px solid #2b3445;
    background:#171d29;
    color:white;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#7d8799;
}

/* PASSWORD */

.password-box{
    position:relative;
    width:100%;
}

.password-box input{
    padding-right:52px;
}

.eye-btn{
    position:absolute;
    right:7px;
    top:50%;
    transform:translateY(-50%);
    width:40px;
    height:40px;
    padding:0;
    margin:0;
    background:transparent;
    border:none;
    color:#aeb7c8;
    cursor:pointer;
    font-size:18px;
}

.eye-btn:hover{
    background:transparent;
    color:white;
    opacity:1;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:white;
    color:#080b12;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.link{
    color:#bfc8d8;
    cursor:pointer;
    font-size:14px;
    text-align:center;
    margin-top:18px;
}

.link:hover{
    color:white;
}

.forgot{
    text-align:right;
    color:#aeb7c8;
    font-size:13px;
    cursor:pointer;
    margin-top:-4px;
    margin-bottom:18px;
}

.forgot:hover{
    color:white;
}

.message{
    min-height:22px;
    text-align:center;
    margin-top:16px;
    color:#d8deea;
    font-size:14px;
}

.logout-btn{
    margin-top:10px;
}

</style>

</head>


<body>

<div class="box">


    <!-- LOGO -->

    <div class="logo">
        🧠 Study Vision
    </div>

    <div class="subtitle">
        Class 12th — JKBOSE
    </div>


    <!-- ================= LOGIN ================= -->

    <div id="loginBox">

        <h2>
            Login
        </h2>


        <label>
            Email
        </label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
        >


        <label>
            Password
        </label>

        <div class="password-box">

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
            >

            <button
                type="button"
                class="eye-btn"
                onclick="togglePassword('loginPassword', this)"
            >
                👁️
            </button>

        </div>


        <div
            class="forgot"
            onclick="showForgot()"
        >
            Forgot password?
        </div>


        <button onclick="loginUser()">
            Login
        </button>


        <div
            class="link"
            onclick="showSignup()"
        >
            Don't have an account? Sign Up
        </div>

    </div>


    <!-- ================= SIGN UP ================= -->

    <div
        id="signupBox"
        style="display:none;"
    >

        <h2>
            Create Account
        </h2>


        <label>
            Email
        </label>

        <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
        >


        <label>
            Password
        </label>

        <div class="password-box">

            <input
                type="password"
                id="signupPassword"
                placeholder="Create password"
            >

            <button
                type="button"
                class="eye-btn"
                onclick="togglePassword('signupPassword', this)"
            >
                👁️
            </button>

        </div>


        <button onclick="signupUser()">
            Create Account
        </button>


        <div
            class="link"
            onclick="showLogin()"
        >
            Already have an account? Login
        </div>

    </div>


    <!-- ================= FORGOT PASSWORD ================= -->

    <div
        id="forgotBox"
        style="display:none;"
    >

        <h2>
            Forgot Password
        </h2>


        <label>
            Email
        </label>

        <input
            type="email"
            id="forgotEmail"
            placeholder="Enter your account email"
        >


        <button onclick="sendResetLink()">
            Send Reset Link
        </button>


        <div
            class="link"
            onclick="showLogin()"
        >
            ← Back to Login
        </div>

    </div>


    <!-- ================= NEW PASSWORD ================= -->

    <div
        id="resetBox"
        style="display:none;"
    >

        <h2>
            New Password
        </h2>


        <label>
            New Password
        </label>

        <div class="password-box">

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
            >

            <button
                type="button"
                class="eye-btn"
                onclick="togglePassword('newPassword', this)"
            >
                👁️
            </button>

        </div>


        <label>
            Confirm Password
        </label>

        <div class="password-box">

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
            >

            <button
                type="button"
                class="eye-btn"
                onclick="togglePassword('confirmPassword', this)"
            >
                👁️
            </button>

        </div>


        <button onclick="updatePassword()">
            Update Password
        </button>

    </div>


    <!-- ================= LOGOUT ================= -->

    <div
        id="logoutBox"
        style="display:none;"
    >

        <h2>
            You're Logged In
        </h2>


        <button onclick="goDashboard()">
            Open Dashboard
        </button>


        <button
            class="logout-btn"
            onclick="logoutUser()"
        >
            Logout
        </button>

    </div>


    <!-- MESSAGE -->

    <div
        class="message"
        id="message"
    ></div>


</div>


<script type="module">


/* =========================================
   SUPABASE
========================================= */

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://qnjfvoskjnyzrvrebdna.supabase.co";


const SUPABASE_KEY =
"sb_publishable_O1zIFLt53T-puwRyg9a4MA_czXQn8G9";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const message =
document.getElementById("message");


/* =========================================
   HIDE ALL BOXES
========================================= */

function hideAll(){

    document.getElementById("loginBox")
        .style.display = "none";

    document.getElementById("signupBox")
        .style.display = "none";

    document.getElementById("forgotBox")
        .style.display = "none";

    document.getElementById("resetBox")
        .style.display = "none";

    document.getElementById("logoutBox")
        .style.display = "none";

}


/* =========================================
   LOGIN PAGE
========================================= */

window.showLogin = function(){

    hideAll();

    document.getElementById("loginBox")
        .style.display = "block";

    message.innerText = "";

};


/* =========================================
   SIGN UP PAGE
========================================= */

window.showSignup = function(){

    hideAll();

    document.getElementById("signupBox")
        .style.display = "block";

    message.innerText = "";

};


/* =========================================
   FORGOT PASSWORD PAGE
========================================= */

window.showForgot = function(){

    hideAll();

    document.getElementById("forgotBox")
        .style.display = "block";

    message.innerText = "";

};


/* =========================================
   OPEN DASHBOARD
========================================= */

window.goDashboard = function(){

    window.location.href =
        "index.html";

};


/* =========================================
   PASSWORD SHOW / HIDE
========================================= */

window.togglePassword = function(
    inputId,
    button
){

    const input =
        document.getElementById(inputId);


    if(input.type === "password"){

        input.type = "text";

        button.innerText = "🙈";

    }
    else{

        input.type = "password";

        button.innerText = "👁️";

    }

};


/* =========================================
   LOGIN
========================================= */

window.loginUser = async function(){

    const email =
        document.getElementById("loginEmail")
        .value
        .trim();


    const password =
        document.getElementById("loginPassword")
        .value;


    if(!email || !password){

        message.innerText =
            "Please enter email and password.";

        return;

    }


    message.innerText =
        "Logging in...";


    const { error } =
        await supabase.auth.signInWithPassword({

            email: email,

            password: password

        });


    if(error){

        message.innerText =
            error.message;

        return;

    }


    message.innerText =
        "Login successful!";


    setTimeout(function(){

        window.location.href =
            "index.html";

    },500);

};


/* =========================================
   SIGN UP
========================================= */

window.signupUser = async function(){

    const email =
        document.getElementById("signupEmail")
        .value
        .trim();


    const password =
        document.getElementById("signupPassword")
        .value;


    if(!email || !password){

        message.innerText =
            "Please enter email and password.";

        return;

    }


    if(password.length < 6){

        message.innerText =
            "Password must be at least 6 characters.";

        return;

    }


    message.innerText =
        "Creating account...";


    const { data, error } =
        await supabase.auth.signUp({

            email: email,

            password: password

        });


    if(error){

        message.innerText =
            error.message;

        return;

    }


    if(data.session){

        window.location.href =
            "index.html";

    }
    else{

        message.innerText =
            "Account created! Check your email to verify it.";

    }

};


/* =========================================
   FORGOT PASSWORD
========================================= */

window.sendResetLink = async function(){

    const email =
        document.getElementById("forgotEmail")
        .value
        .trim();


    if(!email){

        message.innerText =
            "Please enter your email.";

        return;

    }


    message.innerText =
        "Sending reset link...";


    const { error } =
        await supabase.auth.resetPasswordForEmail(

            email,

            {

                redirectTo:
                "https://hamidfurqan918-svg.github.io/StudyVision/login.html"

            }

        );


    if(error){

        message.innerText =
            error.message;

        return;

    }


    message.innerText =
        "Reset link sent! Check your email.";

};


/* =========================================
   UPDATE PASSWORD
========================================= */

window.updatePassword = async function(){

    const password =
        document.getElementById("newPassword")
        .value;


    const confirm =
        document.getElementById("confirmPassword")
        .value;


    if(!password || !confirm){

        message.innerText =
            "Please fill both password fields.";

        return;

    }


    if(password.length < 6){

        message.innerText =
            "Password must be at least 6 characters.";

        return;

    }


    if(password !== confirm){

        message.innerText =
            "Passwords do not match.";

        return;

    }


    message.innerText =
        "Updating password...";


    const { error } =
        await supabase.auth.updateUser({

            password: password

        });


    if(error){

        message.innerText =
            error.message;

        return;

    }


    message.innerText =
        "Password updated successfully!";


    setTimeout(function(){

        showLogin();

    },1500);

};


/* =========================================
   LOGOUT
========================================= */

window.logoutUser = async function(){

    message.innerText =
        "Logging out...";


    const { error } =
        await supabase.auth.signOut();


    if(error){

        message.innerText =
            error.message;

        return;

    }


    showLogin();


    message.innerText =
        "Logged out successfully.";

};


/* =========================================
   PASSWORD RECOVERY
========================================= */

supabase.auth.onAuthStateChange(

    function(event){

        if(event === "PASSWORD_RECOVERY"){

            hideAll();

            document.getElementById("resetBox")
                .style.display = "block";


            message.innerText =
                "Enter your new password.";

        }

    }

);


/* =========================================
   CHECK CURRENT SESSION
========================================= */

const { data } =
    await supabase.auth.getSession();


if(data.session){

    hideAll();

    document.getElementById("logoutBox")
        .style.display = "block";

}

</script>

</body>

</html>
