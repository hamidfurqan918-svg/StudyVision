<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Vision - Quiz</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0b1020;
    color:white;
    min-height:100vh;
}

.header{
    background:#11182d;
    padding:20px 35px;
    border-bottom:1px solid #252d48;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.back{
    background:#252d48;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
}

.back:hover{
    background:#303957;
}

.container{
    max-width:900px;
    margin:35px auto;
    padding:20px;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    font-size:34px;
    margin-bottom:8px;
}

.title p{
    color:#9da7c2;
}

/* FILTERS */

.filters{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:25px;
}

select{
    width:100%;
    padding:14px;

    background:#151d35;
    color:white;

    border:1px solid #303957;
    border-radius:12px;

    outline:none;
    cursor:pointer;
}

/* QUIZ */

.quiz-card{
    background:#151d35;

    border:1px solid #252d48;
    border-radius:20px;

    padding:28px;
}

.info{
    display:flex;
    justify-content:space-between;

    color:#9da7c2;

    margin-bottom:22px;
}

.question{
    font-size:21px;
    line-height:1.5;

    margin-bottom:25px;
}

/* OPTIONS */

.option{
    background:#0f162b;

    border:1px solid #303957;

    padding:16px;

    border-radius:12px;

    margin:12px 0;

    cursor:pointer;

    transition:.2s;
}

.option:hover{
    border-color:#6675ff;
    transform:translateX(3px);
}

.option.correct{
    background:#123526;
    border-color:#35d07f;
}

.option.wrong{
    background:#3a1717;
    border-color:#ff5c5c;
}

.next{
    width:100%;

    margin-top:20px;

    background:#6675ff;
    color:white;

    border:none;

    padding:14px;

    border-radius:12px;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;
}

.next:hover{
    background:#7885ff;
}

/* RESULT */

.result{
    text-align:center;
    padding:35px;
}

.result h2{
    font-size:32px;
    margin-bottom:18px;
}

.result p{
    color:#c7cde0;
    margin:10px;
    font-size:18px;
}

.restart{
    margin-top:20px;

    background:#6675ff;
    color:white;

    border:none;

    padding:13px 25px;

    border-radius:10px;

    cursor:pointer;
}

.hidden{
    display:none;
}

/* MOBILE */

@media(max-width:650px){

    .header{
        padding:18px;
    }

    .container{
        margin:20px auto;
        padding:15px;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .title h1{
        font-size:28px;
    }

    .question{
        font-size:18px;
    }

}

</style>
</head>


<body>


<!-- HEADER -->

    </div>

    <button class="back" onclick="goBack()">

</div>

<!-- FILTERS -->

<!-- QUIZ BOX -->

</div>

/* =====================================================
   VARIABLES
===================================================== */

let currentQuestion;

let score = 0;

let answered = false;

let quizQuestions = [];

let questionNumber = 0;



/* =====================================================
   LOAD CHAPTERS
===================================================== */

function changeSubject(){

    let subject =
        document.getElementById("subjectFilter").value;

    let chapterSelect =
        document.getElementById("chapterFilter");


    chapterSelect.innerHTML =
        '<option value="All">📚 All Chapters</option>';


    let chapters = [];


    questions.forEach(function(item){

        if(
            subject === "All" ||
            item.subject === subject
        ){

            if(!chapters.includes(item.chapter)){

                chapters.push(item.chapter);

            }

        }

    });


    chapters.forEach(function(chapter){

        let option =
            document.createElement("option");

        option.value = chapter;

        option.textContent = chapter;

        chapterSelect.appendChild(option);

    });


    startQuiz();

}



/* =====================================================
   START QUIZ
===================================================== */

function startQuiz(){

    document
        .getElementById("quizBox")
        .classList.remove("hidden");


    document
        .getElementById("resultBox")
        .classList.add("hidden");


    let subject =
        document.getElementById("subjectFilter").value;


    let chapter =
        document.getElementById("chapterFilter").value;


    quizQuestions =
        questions.filter(function(item){

            let subjectMatch =
                subject === "All" ||
                item.subject === subject;


            let chapterMatch =
                chapter === "All" ||
                item.chapter === chapter;


            return subjectMatch && chapterMatch;

        });


    /* Randomize questions */

    quizQuestions.sort(
        () => Math.random() - 0.5
    );


    score = 0;

    questionNumber = 0;


    showQuestion();

}



/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion(){

    if(
        questionNumber >=
        quizQuestions.length
    ){

        finishQuiz();

        return;

    }


    currentQuestion =
        quizQuestions[questionNumber];


    answered = false;


    document
        .getElementById("subjectName")
        .textContent =
        currentQuestion.subject +
        " • " +
        currentQuestion.chapter;


    document
        .getElementById("score")
        .textContent =
        "Score: " + score;


    document
        .getElementById("question")
        .textContent =
        (questionNumber + 1) +
        ". " +
        currentQuestion.q;


    let optionsBox =
        document.getElementById("options");


    optionsBox.innerHTML = "";


    currentQuestion.options.forEach(
        function(option,index){

            let div =
                document.createElement("div");


            div.className = "option";


            div.textContent =
                String.fromCharCode(65 + index) +
                ". " +
                option;


            div.onclick =
                function(){

                    selectAnswer(
                        div,
                        index
                    );

                };


            optionsBox.appendChild(div);

        }
    );

}



/* =====================================================
   SELECT ANSWER
===================================================== */

function selectAnswer(
    element,
    index
){

    if(answered){

        return;

    }


    answered = true;


    let allOptions =
        document.querySelectorAll(".option");


    if(
        index ===
        currentQuestion.answer
    ){

        element.classList.add("correct");

        score++;

    }
    else{

        element.classList.add("wrong");


        allOptions[
            currentQuestion.answer
        ].classList.add("correct");

    }


    document
        .getElementById("score")
        .textContent =
        "Score: " + score;

}



/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion(){

    if(!answered){

        alert(
            "Pehle answer select karo 🙂"
        );

        return;

    }


    questionNumber++;

    showQuestion();

}



/* =====================================================
   FINISH QUIZ
===================================================== */

function finishQuiz(){

    document
        .getElementById("quizBox")
        .classList.add("hidden");


    document
        .getElementById("resultBox")
        .classList.remove("hidden");


    let total =
        quizQuestions.length;


    let xpEarned =
        score * 10;


    document
        .getElementById("finalScore")
        .textContent =
        "Your Score: " +
        score +
        " / " +
        total;


    document
        .getElementById("finalXP")
        .textContent =
        "⭐ XP Earned: +" +
        xpEarned;


    /* Save XP */

    let oldXP =
        Number(
            localStorage.getItem("studyXP")
        ) || 0;


    localStorage.setItem(
        "studyXP",
        oldXP + xpEarned
    );

}
