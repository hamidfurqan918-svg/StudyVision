"Subject-verb agreement requires the verb to agree with its subject.",
"Articles include a, an and the.",
"Correct punctuation helps make meaning clear."
],
formulas:[
"Active → Passive = Object + helping verb + V3 + by + subject",
"Reported speech requires suitable changes in tense/pronouns/time expressions.",
"Subject + Verb agreement"
],
questions:[
"Change active voice into passive voice.",
"Change direct speech into indirect speech.",
"Correct grammatical errors.",
"Practice all important tenses.",
"Use articles correctly.",
"Practice subject-verb agreement."
],
mcqs:[
["Past participle is:", "V3"],
["Passive voice focuses on:", "Receiver of action"],
["Articles are:", "a, an, the"]
]
}

};


/* =====================================================
   DISPLAY CHAPTER
===================================================== */

const data = chapterData[chapter];

if(data){

    document.getElementById("notes").innerHTML =
    data.notes.map(function(note){
        return `<div class="note">${note}</div>`;
    }).join("");

    document.getElementById("formulas").innerHTML =
    data.formulas.map(function(formula){
        return `<div class="formula">${formula}</div>`;
    }).join("");

    document.getElementById("questions").innerHTML =
    data.questions.map(function(question,index){
        return `
        <div class="question">
            <strong>Q${index+1}.</strong> ${question}
        </div>
        `;
    }).join("");

    document.getElementById("mcqs").innerHTML =
    data.mcqs.map(function(mcq,index){

        return `
        <div class="mcq">

            <strong>${index+1}. ${mcq[0]}</strong>

            <div class="option"
                 onclick="showAnswer('answer${index}')">
                 👁️ Show Answer
            </div>

            <div class="answer" id="answer${index}">
                ✅ Correct Answer: ${mcq[1]}
            </div>

        </div>
        `;

    }).join("");

}else{

    document.getElementById("notes").innerHTML =
    `<div class="empty">❌ This chapter was not found.</div>`;

    document.getElementById("formulas").innerHTML =
    `<div class="empty">No formulas available.</div>`;

    document.getElementById("questions").innerHTML =
    `<div class="empty">No questions available.</div>`;

    document.getElementById("mcqs").innerHTML =
    `<div class="empty">No MCQs available.</div>`;
}


/* =====================================================
   PROGRESS
===================================================== */

const storageKey =
"completed_" +
subject.replace(/\s+/g,"_") +
"_" +
chapter.replace(/\s+/g,"_");

if(localStorage.getItem(storageKey) === "true"){

    document.getElementById("progressFill").style.width =
    "100%";

}


/* =====================================================
   SHOW ANSWER
===================================================== */

function showAnswer(id){

    const answer = document.getElementById(id);

    if(answer.style.display === "block"){
        answer.style.display = "none";
    }else{
        answer.style.display = "block";
    }

}


/* =====================================================
   COMPLETE CHAPTER
===================================================== */

function completeChapter(){

    const alreadyCompleted =
    localStorage.getItem(storageKey) === "true";

    if(!alreadyCompleted){

        let oldXP =
        Number(localStorage.getItem("studyXP")) || 0;

        localStorage.setItem(
            "studyXP",
            oldXP + 50
        );

        alert(
            "🎉 Chapter Completed!\n\n" +
            chapter +
            "\n\n+50 XP earned!"
        );

    }else{

        alert(
            "✅ This chapter is already completed!"
        );

    }

    localStorage.setItem(
        storageKey,
        "true"
    );

    document.getElementById("progressFill").style.width =
    "100%";

}


/* =====================================================
   BACK
===================================================== */

function goBack(){

    window.location.href = "subjects.html";

}

</script>
