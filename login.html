<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0">

<title>Study Vision - Login</title>

<link rel="manifest"
      href="./manifest.json">

<meta name="theme-color"
      content="#080b12">

<link rel="icon"
      type="image/png"
      href="./study-vision-icon-192.png">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{

    min-height:100vh;

    background:#080b12;

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}

.container{

    width:100%;

    max-width:400px;

}

.logo{

    width:85px;

    height:85px;

    display:block;

    margin:0 auto 18px;

    border-radius:20px;

}

.title{

    text-align:center;

    font-size:30px;

    margin-bottom:8px;

}

.subtitle{

    text-align:center;

    color:#8c95a8;

    margin-bottom:28px;

}

.box{

    background:#111722;

    border:1px solid #202636;

    border-radius:20px;

    padding:25px;

}

.tabs{

    display:flex;

    gap:8px;

    margin-bottom:20px;

}

.tabs button{

    flex:1;

    padding:11px;

    border:0;

    border-radius:10px;

    background:#202636;

    color:white;

    cursor:pointer;

}

.tabs button.active{

    background:#6c5ce7;

}

.form{

    display:none;

}

.form.active{

    display:block;

}

label{

    display:block;

    margin-bottom:7px;

    color:#c7ccda;

    font-size:14px;

}

input{

    width:100%;

    padding:13px;

    border-radius:10px;

    border:1px solid #293145;

    background:#080b12;

    color:white;

    outline:none;

    margin-bottom:15px;

}

input:focus{

    border-color:#6c5ce7;

}

.password-box{

    position:relative;

}

.password-box input{

    padding-right:50px;

}

.eye-btn{

    position:absolute;

    right:8px;

    top:0;

    height:42px;

    width:40px;

    background:transparent;

    color:white;

    border:0;

    cursor:pointer;

    font-size:18px;

}

.main-btn{

    width:100%;

    padding:13px;

    border:0;

    border-radius:10px;

    background:#6c5ce7;

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    margin-top:5px;

}

.secondary-btn{

    width:100%;

    padding:11px;

    border:0;

    border-radius:10px;

    background:#202636;

    color:white;

    cursor:pointer;

    margin-top:10px;

}

.message{

    margin-top:15px;

    text-align:center;

    font-size:13px;

    color:#8c95a8;

    min-height:20px;

}

.forgot{

    text-align:right;

    margin-top:-7px;

    margin-bottom:12px;

}

.forgot button{

    background:none;

    border:0;

    color:#8f82ff;

    cursor:pointer;

}

#resetBox{

    display:none;

}

</style>

</head>


<body>


<div class="container">

    <img
        class="logo"
        src="./study-vision-icon-192.png"
    >

    <h1 class="title">
        Study Vision
    </h1>

    <p class="subtitle">
        Class 12th JKBOSE Study App
    </p>


    <div class="box">


        <div class="tabs">

            <button
                id="loginTab"
                class="active"
                onclick="showLogin()">
                Login
            </button>

            <button
                id="signupTab"
                onclick="showSignup()">
                Sign Up
            </button>

        </div>


        <!-- LOGIN -->

        <div
            id="loginForm"
            class="form active">

            <label>Email</label>

            <input
                id="loginEmail"
                type="email"
                placeholder="Enter your email"
                autocomplete="email"
            >


            <label>Password</label>

            <div class="password-box">

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >

                <button
                    class="eye-btn"
                    type="button"
                    onclick="togglePassword(
                        'loginPassword',
                        this
                    )">
                    👁️
                </button>

            </div>


            <div class="forgot">

                <button
                    onclick="showForgot()">
                    Forgot Password?
                </button>

            </div>


            <button
                class="main-btn"
                onclick="login()">
                Login
            </button>


            <div
                class="message"
                id="loginMessage">
            </div>

        </div>


        <!-- SIGNUP -->

        <div
            id="signupForm"
            class="form">

            <label>Email</label>

            <input
                id="signupEmail"
                type="email"
                placeholder="Enter your email"
                autocomplete="email"
            >


            <label>Password</label>

            <div class="password-box">

                <input
                    id="signupPassword"
                    type="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                >

                <button
                    class="eye-btn"
                    type="button"
                    onclick="togglePassword(
                        'signupPassword',
                        this
                    )">
                    👁️
                </button>

            </div>


            <button
                class="main-btn"
                onclick="signup()">
                Create Account
            </button>


            <div
                class="message"
                id="signupMessage">
            </div>

        </div>


        <!-- FORGOT PASSWORD -->

        <div
            id="forgotForm"
            class="form">

            <h3 style="margin-bottom:15px;">
                Reset Password
            </h3>

            <label>Email</label>

            <input
                id="forgotEmail"
                type="email"
                placeholder="Enter your email"
            >


            <button
                class="main-btn"
                onclick="sendReset()">
                Send Reset Email
            </button>


            <button
                class="secondary-btn"
                onclick="showLogin()">
                ← Back to Login
            </button>


            <div
                class="message"
                id="forgotMessage">
            </div>

        </div>


        <!-- NEW PASSWORD -->

        <div
            id="resetBox"
            class="form">

            <h3 style="margin-bottom:15px;">
                Create New Password
            </h3>


            <label>New Password</label>

            <div class="password-box">

                <input
                    id="newPassword"
                    type="password"
                    placeholder="New password"
                >

                <button
                    class="eye-btn"
                    type="button"
                    onclick="togglePassword(
                        'newPassword',
                        this
                    )">
                    👁️
                </button>

            </div>


            <label>Confirm Password</label>

            <div class="password-box">

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Confirm password"
                >

                <button
                    class="eye-btn"
                    type="button"
                    onclick="togglePassword(
                        'confirmPassword',
                        this
                    )">
                    👁️
                </button>

            </div>


            <button
                class="main-btn"
                onclick="updatePassword()">
                Update Password
            </button>


            <div
                class="message"
                id="resetMessage">
            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


const SUPABASE_URL =
"https://qnjfvoskjnyzrvrebdna.supabase.co";

const SUPABASE_KEY =
"sb_publishable_O1zIFLt53T-puwRyg9a4MA_czXQn8G9";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* TABS */

function hideAll(){

    document
        .querySelectorAll(".form")
        .forEach(function(form){

            form.classList.remove("active");

        });

}


function showLogin(){

    hideAll();

    document
        .getElementById("loginForm")
        .classList.add("active");

    document
        .getElementById("loginTab")
        .classList.add("active");

    document
        .getElementById("signupTab")
        .classList.remove("active");

}


function showSignup(){

    hideAll();

    document
        .getElementById("signupForm")
        .classList.add("active");

    document
        .getElementById("signupTab")
        .classList.add("active");

    document
        .getElementById("loginTab")
        .classList.remove("active");

}


function showForgot(){

    hideAll();

    document
        .getElementById("forgotForm")
        .classList.add("active");

}


/* PASSWORD EYE */

function togglePassword(inputId,button){

    const input =
        document.getElementById(inputId);

    if(input.type === "password"){

        input.type = "text";

        button.innerText = "🙈";

    }else{

        input.type = "password";

        button.innerText = "👁️";

    }

}


/* LOGIN */

async function login(){

    const email =
        document.getElementById(
            "loginEmail"
        ).value.trim();

    const password =
        document.getElementById(
            "loginPassword"
        ).value;

    const message =
        document.getElementById(
            "loginMessage"
        );


    if(!email || !password){

        message.innerText =
            "Please enter email and password.";

        return;
    }


    message.innerText =
        "Logging in...";


    const {
        data,
        error
    } =
    await supabaseClient.auth.signInWithPassword({

        email:email,

        password:password

    });


    if(error){

        message.innerText =
            error.message;

        return;

    }


    message.innerText =
        "Login successful!";


    window.location.replace(
        "index.html"
    );

}


/* SIGN UP */

async function signup(){

    const email =
        document.getElementById(
            "signupEmail"
        ).value.trim();

    const password =
        document.getElementById(
            "signupPassword"
        ).value;


    const message =
        document.getElementById(
            "signupMessage"
        );


    if(!email || !password){

        message.innerText =
            "Please enter email and password.";

        return;

    }


    if(password.length < 6){

        message.innerText =
            "Password must be at least 6 characters.";

        return;

    }


    message.innerText =
        "Creating account...";


    const {
        data,
        error
    } =
    await supabaseClient.auth.signUp({

        email:email,

        password:password

    });


    if(error){

        message.innerText =
            error.message;

        return;

    }


    if(data.session){

        window.location.replace(
            "index.html"
        );

    }else{

        message.innerText =
            "Account created! Check your email to verify your account.";

    }

}


/* FORGOT PASSWORD */

async function sendReset(){

    const email =
        document.getElementById(
            "forgotEmail"
        ).value.trim();

    const message =
        document.getElementById(
            "forgotMessage"
        );


    if(!email){

        message.innerText =
            "Please enter your email.";

        return;

    }


    message.innerText =
        "Sending reset email...";


    const {
        error
    } =
    await supabaseClient.auth
        .resetPasswordForEmail(
            email,
            {
                redirectTo:
                "https://hamidfurqan918-svg.github.io/StudyVision/login.html"
            }
        );


    if(error){

        message.innerText =
            error.message;

        return;

    }


    message.innerText =
        "Password reset email sent.";

}


/* PASSWORD UPDATE */

async function updatePassword(){

    const password =
        document.getElementById(
            "newPassword"
        ).value;

    const confirm =
        document.getElementById(
            "confirmPassword"
        ).value;

    const message =
        document.getElementById(
            "resetMessage"
        );


    if(!password || !confirm){

        message.innerText =
            "Please fill both fields.";

        return;

    }


    if(password !== confirm){

        message.innerText =
            "Passwords do not match.";

        return;

    }


    const {
        error
    } =
    await supabaseClient.auth
        .updateUser({
            password:password
        });


    if(error){

        message.innerText =
            error.message;

        return;

    }


    message.innerText =
        "Password updated successfully.";

    setTimeout(
        function(){

            window.location.replace(
                "index.html"
            );

        },
        1200
    );

}


/* RESET SESSION CHECK */

supabaseClient.auth.onAuthStateChange(
    function(event,session){

        if(event === "PASSWORD_RECOVERY"){

            hideAll();

            document
                .getElementById("resetBox")
                .style.display = "block";

            document
                .getElementById("resetBox")
                .classList.add("active");

        }

    }
);


/* SERVICE WORKER */

if("serviceWorker" in navigator){

    window.addEventListener(
        "load",
        function(){

            navigator.serviceWorker
                .register("./sw.js")
                .catch(function(error){

                    console.log(
                        "Service Worker Error:",
                        error
                    );

                });

        }
    );

}

</script>

</body>
</html>
